<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日计划 · 余晖暗夜</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', 'Georgia', 'Times New Roman', serif;
        }

        body {
            background: #1a1412;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            max-width: 720px;
            width: 100%;
            background: #1f1815;
            border-radius: 48px;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6), 0 8px 24px rgba(0, 0, 0, 0.3);
            padding: 28px 24px 32px;
            border: 1px solid rgba(160, 93, 79, 0.12);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-left,
        .nav-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .nav-btn {
            background: rgba(160, 93, 79, 0.15);
            border: 1px solid rgba(160, 93, 79, 0.1);
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #d4b8a8;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.5px;
            font-family: 'Noto Serif SC', serif;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(160, 93, 79, 0.25);
            color: #e8cdbd;
            transform: translateY(-1px);
            border-color: rgba(160, 93, 79, 0.2);
        }
        .nav-btn:active {
            transform: scale(0.96);
        }

        .date-display {
            font-size: 18px;
            font-weight: 600;
            color: #d4b8a8;
            background: rgba(160, 93, 79, 0.12);
            border: 1px solid rgba(160, 93, 79, 0.08);
            padding: 6px 22px;
            border-radius: 60px;
            white-space: nowrap;
            letter-spacing: 0.8px;
            font-family: 'Noto Serif SC', serif;
            backdrop-filter: blur(8px);
        }

        .calendar-toggle {
            background: rgba(160, 93, 79, 0.15);
            border: 1px solid rgba(160, 93, 79, 0.1);
            border-radius: 40px;
            padding: 8px 14px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1;
            color: #d4b8a8;
        }
        .calendar-toggle:hover {
            background: rgba(160, 93, 79, 0.25);
            transform: translateY(-1px);
            border-color: rgba(160, 93, 79, 0.2);
        }

        .day-card {
            background: rgba(255, 252, 248, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 24px 22px 26px;
            border: 1px solid rgba(160, 93, 79, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            margin-top: 4px;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid rgba(160, 93, 79, 0.08);
            padding-bottom: 14px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .day-name-big {
            font-size: 26px;
            font-weight: 600;
            color: #e8cdbd;
            letter-spacing: 1px;
            font-family: 'Noto Serif SC', serif;
        }

        .day-date-badge {
            background: rgba(160, 93, 79, 0.08);
            padding: 4px 18px;
            border-radius: 60px;
            font-size: 14px;
            color: #c9a898;
            font-weight: 500;
            font-family: 'Noto Serif SC', serif;
            border: 1px solid rgba(160, 93, 79, 0.05);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 16px;
            line-height: 1.6;
            color: #d4b8a8;
            padding: 8px 12px;
            border-radius: 20px;
            background: rgba(255, 252, 248, 0.02);
            transition: all 0.15s;
            border: 1px solid transparent;
            font-family: 'Noto Serif SC', serif;
        }

        .task-item:hover {
            background: rgba(255, 252, 248, 0.04);
            border-color: rgba(160, 93, 79, 0.05);
        }

        .task-item input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(160, 93, 79, 0.25);
            border-radius: 50%;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255, 252, 248, 0.03);
            position: relative;
            margin: 0;
        }

        .task-item input[type="checkbox"]:checked {
            background: #a05d4f;
            border-color: #a05d4f;
            box-shadow: 0 4px 16px rgba(160, 93, 79, 0.3);
        }

        .task-item input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            color: white;
            font-size: 16px;
            font-weight: 700;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .task-item label {
            cursor: pointer;
            flex: 1;
            word-break: break-word;
            font-weight: 450;
        }

        .task-item input[type="checkbox"]:checked+label {
            text-decoration: line-through;
            color: rgba(180, 160, 148, 0.5);
            font-weight: 400;
        }

        .empty-tasks {
            color: rgba(180, 160, 148, 0.5);
            padding: 24px 0 12px;
            text-align: center;
            font-style: italic;
            font-weight: 400;
            letter-spacing: 0.5px;
            font-family: 'Noto Serif SC', serif;
        }

        .weekly-congrats {
            margin-top: 20px;
            padding: 18px 22px;
            background: rgba(160, 93, 79, 0.06);
            border-radius: 24px;
            border: 1px solid rgba(160, 93, 79, 0.06);
            text-align: center;
            display: none;
            animation: slideUp 0.5s ease;
            backdrop-filter: blur(4px);
        }

        .weekly-congrats.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weekly-congrats .emoji-big {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }

        .weekly-congrats .title {
            font-size: 20px;
            font-weight: 600;
            color: #e8cdbd;
            letter-spacing: 1px;
            font-family: 'Noto Serif SC', serif;
        }

        .weekly-congrats .sub {
            font-size: 15px;
            color: #c9a898;
            margin-top: 4px;
            font-family: 'Noto Serif SC', serif;
        }

        .weekly-congrats .progress-text {
            font-size: 13px;
            color: rgba(180, 160, 148, 0.6);
            margin-top: 6px;
            opacity: 0.8;
            font-family: 'Noto Serif SC', serif;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-box {
            background: rgba(31, 24, 21, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 48px;
            max-width: 520px;
            width: 100%;
            padding: 30px 26px 34px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(160, 93, 79, 0.08);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 600;
            color: #e8cdbd;
            letter-spacing: 0.8px;
            font-family: 'Noto Serif SC', serif;
        }

        .modal-close {
            background: rgba(160, 93, 79, 0.08);
            border: 1px solid rgba(160, 93, 79, 0.05);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            color: #d4b8a8;
            font-weight: 500;
            font-family: 'Noto Serif SC', serif;
        }
        .modal-close:hover {
            background: rgba(160, 93, 79, 0.15);
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-nav button {
            background: rgba(160, 93, 79, 0.06);
            border: 1px solid rgba(160, 93, 79, 0.04);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            font-weight: 500;
            color: #d4b8a8;
            font-family: 'Noto Serif SC', serif;
        }
        .month-nav button:hover {
            background: rgba(160, 93, 79, 0.12);
        }

        .month-year-label {
            font-weight: 600;
            font-size: 19px;
            color: #e8cdbd;
            letter-spacing: 0.8px;
            font-family: 'Noto Serif SC', serif;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            margin-top: 6px;
        }

        .calendar-grid .weekday-label {
            font-weight: 500;
            color: rgba(180, 160, 148, 0.5);
            font-size: 14px;
            padding: 10px 0 6px;
            letter-spacing: 0.5px;
            font-family: 'Noto Serif SC', serif;
        }

        .calendar-grid .day-cell {
            padding: 12px 0;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            color: #c9a898;
            background: transparent;
            font-family: 'Noto Serif SC', serif;
            position: relative;
        }

        .calendar-grid .day-cell:hover {
            background: rgba(160, 93, 79, 0.06);
        }

        .calendar-grid .day-cell.selected {
            background: #a05d4f;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(160, 93, 79, 0.2);
        }

        .calendar-grid .day-cell.other-month {
            color: rgba(180, 160, 148, 0.25);
        }

        .calendar-grid .day-cell.today {
            border: 2px solid rgba(160, 93, 79, 0.2);
            background: rgba(160, 93, 79, 0.03);
        }

        .calendar-grid .day-cell.today.selected {
            border: 2px solid white;
        }

        .calendar-grid .day-cell .dot {
            color: #a05d4f;
            font-size: 10px;
            display: block;
            margin-top: -2px;
        }

        .goto-today {
            margin-top: 22px;
            display: flex;
            justify-content: center;
        }

        .goto-today button {
            background: rgba(160, 93, 79, 0.06);
            border: 1px solid rgba(160, 93, 79, 0.04);
            padding: 10px 32px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            color: #d4b8a8;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Noto Serif SC', serif;
        }
        .goto-today button:hover {
            background: rgba(160, 93, 79, 0.12);
        }

        .footer-note {
            margin-top: 24px;
            font-size: 14px;
            color: rgba(180, 160, 148, 0.3);
            text-align: center;
            border-top: 1px solid rgba(160, 93, 79, 0.04);
            padding-top: 18px;
            letter-spacing: 0.5px;
            font-weight: 400;
            font-family: 'Noto Serif SC', serif;
        }

        .footer-note span {
            background: rgba(160, 93, 79, 0.04);
            padding: 2px 14px;
            border-radius: 40px;
            color: rgba(180, 160, 148, 0.3);
        }

        @media (max-width: 520px) {
            .app {
                padding: 18px 14px 24px;
                border-radius: 32px;
            }
            .date-display {
                font-size: 16px;
                padding: 4px 14px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 13px;
            }
            .day-name-big {
                font-size: 22px;
            }
            .day-card {
                padding: 18px 14px 20px;
            }
            .task-item {
                font-size: 14px;
                padding: 6px 10px;
            }
            .modal-box {
                padding: 22px 16px 26px;
            }
            .weekly-congrats {
                padding: 14px 16px;
            }
            .weekly-congrats .title {
                font-size: 18px;
            }
        }

        @media (max-width: 400px) {
            .nav-bar {
                gap: 4px;
            }
            .nav-left,
            .nav-right {
                gap: 4px;
            }
            .date-display {
                font-size: 14px;
                padding: 2px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="nav-bar">
            <div class="nav-left">
                <button class="nav-btn" id="prevDayBtn">← 昨天</button>
                <button class="nav-btn" id="todayBtn">今天</button>
            </div>
            <div class="date-display" id="dateDisplay">2026-08-31 周一</div>
            <div class="nav-right">
                <button class="nav-btn" id="nextDayBtn">明天 →</button>
                <button class="calendar-toggle" id="calendarToggleBtn" aria-label="打开日历">📅</button>
            </div>
        </div>

        <div class="day-card" id="dayCard">
            <div class="day-header">
                <span class="day-name-big" id="dayNameBig">周一</span>
                <span class="day-date-badge" id="dayDateBadge">8月31日</span>
            </div>
            <div class="task-list" id="taskListContainer"></div>

            <div class="weekly-congrats" id="weeklyCongrats">
                <span class="emoji-big">🎉</span>
                <div class="title">恭喜你完成本周计划</div>
                <div class="sub">沉默是一种美德，但坚持更是一种力量</div>
                <div class="progress-text" id="progressText">本周已完成 7/7 天</div>
            </div>
        </div>

        <div class="footer-note">
            <span>✓</span> 勾选完成 · 计划按星期循环 · 点击日历跳转
        </div>
    </div>

    <div class="modal-overlay" id="calendarModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2>📅 选择日期</h2>
                <button class="modal-close" id="modalCloseBtn">✕ 关闭</button>
            </div>
            <div class="month-nav">
                <button id="monthPrevBtn">◀</button>
                <span class="month-year-label" id="monthYearLabel">2026年 8月</span>
                <button id="monthNextBtn">▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div class="goto-today">
                <button id="gotoTodayBtn">📍 回到今天</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 数据 ----------
            const WEEKLY_SCHEDULE = {
                '周一': [
                    '早餐：豆浆➕粗粮➕鸡蛋',
                    '8:30-9:30 学习英语',
                    '10:00-12:00 健身（核心、手臂、肩背、跑步）',
                    '19:00-21:00 学习英语'
                ],
                '周二': [
                    '早餐：豆浆➕粗粮➕鸡蛋',
                    '滑雪'
                ],
                '周三': [
                    '早餐：豆浆➕粗粮➕鸡蛋',
                    '滑雪'
                ],
                '周四': [
                    '早餐：豆浆➕粗粮➕鸡蛋',
                    '16:00-17:30 健身（核心、臀腿、跑步）'
                ],
                '周五': [
                    '早餐：豆浆➕粗粮➕鸡蛋',
                    '18:00-19:30 学习英语'
                ],
                '周六': [
                    '游泳',
                    '学习英语'
                ],
                '周日': [
                    '游泳',
                    '学习英语'
                ]
            };

            const WEEKDAY_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

            // ---------- 状态 ----------
            let currentDate = new Date();
            let calendarYear = currentDate.getFullYear();
            let calendarMonth = currentDate.getMonth();

            // 存储完成状态
            let completionMap = new Map();

            // DOM 引用
            const dateDisplay = document.getElementById('dateDisplay');
            const dayNameBig = document.getElementById('dayNameBig');
            const dayDateBadge = document.getElementById('dayDateBadge');
            const taskListContainer = document.getElementById('taskListContainer');
            const weeklyCongrats = document.getElementById('weeklyCongrats');
            const progressText = document.getElementById('progressText');

            const prevDayBtn = document.getElementById('prevDayBtn');
            const nextDayBtn = document.getElementById('nextDayBtn');
            const todayBtn = document.getElementById('todayBtn');
            const calendarToggleBtn = document.getElementById('calendarToggleBtn');
            const modalOverlay = document.getElementById('calendarModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const monthPrevBtn = document.getElementById('monthPrevBtn');
            const monthNextBtn = document.getElementById('monthNextBtn');
            const monthYearLabel = document.getElementById('monthYearLabel');
            const calendarGrid = document.getElementById('calendarGrid');
            const gotoTodayBtn = document.getElementById('gotoTodayBtn');

            // ---------- 辅助函数 ----------
            function formatDateKey(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }

            function getWeekdayName(date) {
                return WEEKDAY_NAMES[date.getDay()];
            }

            function getDayTasks(date) {
                const weekday = getWeekdayName(date);
                return WEEKLY_SCHEDULE[weekday] || [];
            }

            function saveCompletionMap() {
                try {
                    const obj = {};
                    completionMap.forEach((value, key) => {
                        obj[key] = value;
                    });
                    localStorage.setItem('weeklyPlanCompletion_v5', JSON.stringify(obj));
                } catch (e) {}
            }

            function loadCompletionMap() {
                try {
                    const data = localStorage.getItem('weeklyPlanCompletion_v5');
                    if (data) {
                        const obj = JSON.parse(data);
                        completionMap = new Map(Object.entries(obj));
                        const now = new Date();
                        const thirtyDaysAgo = new Date(now);
                        thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
                        const cutoff = formatDateKey(thirtyDaysAgo);
                        for (const key of completionMap.keys()) {
                            if (key < cutoff) {
                                completionMap.delete(key);
                            }
                        }
                        saveCompletionMap();
                    }
                } catch (e) {
                    completionMap = new Map();
                }
            }

            function getWeekDates(referenceDate) {
                const dayOfWeek = referenceDate.getDay();
                const diffToMonday = (dayOfWeek === 0) ? -6 : 1 - dayOfWeek;
                const monday = new Date(referenceDate);
                monday.setDate(referenceDate.getDate() + diffToMonday);
                monday.setHours(0, 0, 0, 0);
                const weekDates = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    weekDates.push(d);
                }
                return weekDates;
            }

            function checkWeeklyCompletion() {
                const weekDates = getWeekDates(currentDate);
                let completedCount = 0;
                let totalTasks = 0;

                weekDates.forEach(date => {
                    const tasks = getDayTasks(date);
                    if (tasks.length === 0) return;
                    totalTasks++;
                    const dateKey = formatDateKey(date);
                    if (completionMap.get(dateKey) === true) {
                        completedCount++;
                    }
                });

                if (totalTasks === 0) {
                    weeklyCongrats.classList.remove('show');
                    return;
                }

                const allCompleted = (completedCount === totalTasks);
                if (allCompleted) {
                    weeklyCongrats.classList.add('show');
                    progressText.textContent = `本周已完成 ${completedCount}/${totalTasks} 天 🎊`;
                } else {
                    weeklyCongrats.classList.remove('show');
                }
                return allCompleted;
            }

            // ---------- 渲染 ----------
            function renderDay(date) {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const weekday = getWeekdayName(date);
                const dateKey = formatDateKey(date);

                dateDisplay.textContent = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')} ${weekday}`;
                dayNameBig.textContent = weekday;
                dayDateBadge.textContent = `${month}月${day}日`;

                const tasks = getDayTasks(date);
                taskListContainer.innerHTML = '';

                if (!tasks || tasks.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-tasks';
                    empty.textContent = '✨ 今天没有安排，放松一下吧';
                    taskListContainer.appendChild(empty);
                    checkWeeklyCompletion();
                    return;
                }

                const isDayCompleted = completionMap.get(dateKey) === true;

                tasks.forEach((taskText, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'task-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    const uid = `task-${dateKey}-${index}`;
                    checkbox.id = uid;
                    checkbox.checked = isDayCompleted;

                    const label = document.createElement('label');
                    label.htmlFor = uid;
                    label.textContent = taskText;

                    // ★ 核心修复：使用 click 事件，不触发布局重排
                    checkbox.addEventListener('click', function(e) {
                        // 获取当前所有 checkbox
                        const allCheckboxes = taskListContainer.querySelectorAll('input[type="checkbox"]');
                        let allChecked = true;
                        allCheckboxes.forEach(cb => {
                            if (!cb.checked) allChecked = false;
                        });

                        // 更新完成状态
                        completionMap.set(dateKey, allChecked);

                        // 保存
                        saveCompletionMap();

                        // 更新每周小结
                        checkWeeklyCompletion();

                        // 更新日历标记
                        if (modalOverlay.classList.contains('active')) {
                            renderCalendar(calendarYear, calendarMonth);
                        }
                    });

                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);
                    taskListContainer.appendChild(itemDiv);
                });

                checkWeeklyCompletion();
            }

            function setDate(date) {
                currentDate = new Date(date);
                currentDate.setHours(0, 0, 0, 0);
                renderDay(currentDate);
                if (modalOverlay.classList.contains('active')) {
                    renderCalendar(calendarYear, calendarMonth);
                }
            }

            function changeDay(delta) {
                const newDate = new Date(currentDate);
                newDate.setDate(newDate.getDate() + delta);
                setDate(newDate);
            }

            // ---------- 日历 ----------
            function renderCalendar(year, month) {
                calendarYear = year;
                calendarMonth = month;
                monthYearLabel.textContent = `${year}年 ${month + 1}月`;

                const firstDayOfMonth = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrevMonth = new Date(year, month, 0).getDate();

                let html = '';
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                weekdays.forEach(wd => {
                    html += `<div class="weekday-label">${wd}</div>`;
                });

                const startOffset = firstDayOfMonth;
                let dayCount = 1;
                let nextMonthDay = 1;
                const today = new Date();
                const todayStr = formatDateKey(today);

                for (let i = 0; i < 42; i++) {
                    let dayNumber;
                    let isCurrentMonth = true;
                    let dateObj;

                    if (i < startOffset) {
                        const prevMonthDays = daysInPrevMonth - startOffset + i + 1;
                        dayNumber = prevMonthDays;
                        isCurrentMonth = false;
                        dateObj = new Date(year, month - 1, dayNumber);
                    } else if (dayCount <= daysInMonth) {
                        dayNumber = dayCount;
                        dateObj = new Date(year, month, dayNumber);
                        dayCount++;
                    } else {
                        dayNumber = nextMonthDay;
                        isCurrentMonth = false;
                        dateObj = new Date(year, month + 1, dayNumber);
                        nextMonthDay++;
                    }

                    const dateStr = formatDateKey(dateObj);
                    const isToday = (dateStr === todayStr);
                    const isSelected = (dateStr === formatDateKey(currentDate));

                    let classes = 'day-cell';
                    if (!isCurrentMonth) classes += ' other-month';
                    if (isToday) classes += ' today';
                    if (isSelected) classes += ' selected';

                    const isCompleted = completionMap.get(dateStr) === true;
                    const hasTasks = getDayTasks(dateObj).length > 0;
                    let dotHtml = '';
                    if (isCompleted && hasTasks) {
                        dotHtml = `<span class="dot">●</span>`;
                    }

                    html += `<div class="${classes}" data-date="${dateStr}">${dayNumber}${dotHtml}</div>`;
                }

                calendarGrid.innerHTML = html;

                calendarGrid.querySelectorAll('.day-cell').forEach(cell => {
                    cell.addEventListener('click', function(e) {
                        const dateStr = this.dataset.date;
                        if (!dateStr) return;
                        const parts = dateStr.split('-').map(Number);
                        const selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
                        setDate(selectedDate);
                        modalOverlay.classList.remove('active');
                    });
                });
            }

            function openCalendar() {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                renderCalendar(year, month);
                modalOverlay.classList.add('active');
            }

            // ---------- 事件绑定 ----------
            prevDayBtn.addEventListener('click', () => changeDay(-1));
            nextDayBtn.addEventListener('click', () => changeDay(1));
            todayBtn.addEventListener('click', () => setDate(new Date()));

            calendarToggleBtn.addEventListener('click', openCalendar);
            modalCloseBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });

            monthPrevBtn.addEventListener('click', () => renderCalendar(calendarYear, calendarMonth - 1));
            monthNextBtn.addEventListener('click', () => renderCalendar(calendarYear, calendarMonth + 1));

            gotoTodayBtn.addEventListener('click', () => {
                const today = new Date();
                setDate(today);
                renderCalendar(today.getFullYear(), today.getMonth());
                modalOverlay.classList.remove('active');
            });

            // ---------- 初始化 ----------
            loadCompletionMap();
            const todayDate = new Date();
            todayDate.setHours(0, 0, 0, 0);
            setDate(todayDate);

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') return;
                if (modalOverlay.classList.contains('active')) {
                    if (e.key === 'Escape') modalOverlay.classList.remove('active');
                    return;
                }
                if (e.key === 'ArrowLeft') { e.preventDefault();
                    changeDay(-1); } else if (e.key === 'ArrowRight') { e.preventDefault();
                    changeDay(1); }
            });

            console.log('✅ 每日计划 · 余晖暗夜风格 已加载 (勾选功能已修复)');
        })();
    </script>
</body>
</html>
