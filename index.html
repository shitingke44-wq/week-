<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词循环测</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(145deg, #eef2ff 0%, #e0e7ff 50%, #ede9fe 100%);
    color: #1e293b;
  }

  .page {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .page.active {
    display: flex;
    animation: fadeIn .28s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    width: 100%;
    max-width: 540px;
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 30px 26px;
    box-shadow: 0 20px 60px -20px rgba(79, 70, 229, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .quiz-card {
    min-height: min(500px, calc(100dvh - 32px));
  }

  h1 {
    font-size: 1.65rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 0.88rem;
    color: #64748b;
    margin-top: 8px;
    line-height: 1.55;
  }

  .field { display: flex; flex-direction: column; gap: 9px; }
  .field > label {
    font-size: 0.82rem;
    font-weight: 700;
    color: #475569;
    letter-spacing: 0.03em;
  }

  textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    font-size: 0.95rem;
    font-family: inherit;
    line-height: 1.65;
    resize: vertical;
    min-height: 100px;
    max-height: 180px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  textarea:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, .15);
  }

  .hint {
    font-size: 0.76rem;
    color: #94a3b8;
    line-height: 1.6;
  }
  .hint code {
    background: #eef2ff;
    color: #4f46e5;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }

  .action-row {
    display: flex;
    gap: 10px;
  }

  .import-msg {
    display: none;
    align-items: flex-start;
    gap: 8px;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.55;
    word-break: break-word;
    animation: fadeIn .22s ease;
  }
  .import-msg.show { display: flex; }
  .import-msg .icon { flex-shrink: 0; font-size: 1rem; line-height: 1.4; }
  .import-msg.success {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
  }
  .import-msg.error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
  }

  .mode-selector { display: flex; gap: 10px; }
  .mode-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 10px;
    border-radius: 15px;
    border: 1.5px solid #e2e8f0;
    background: #fff;
    cursor: pointer;
    font-weight: 700;
    font-size: 0.94rem;
    color: #64748b;
    transition: all .2s;
    user-select: none;
  }
  .mode-option:has(input:checked) {
    border-color: #6366f1;
    background: #eef2ff;
    color: #4f46e5;
    box-shadow: 0 6px 16px -6px rgba(99, 102, 241, .5);
  }
  .mode-option input { accent-color: #6366f1; width: 16px; height: 16px; }

  .primary-btn {
    width: 100%;
    padding: 15px 22px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    box-shadow: 0 10px 26px -8px rgba(99, 102, 241, .65);
  }
  .primary-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 30px -8px rgba(99, 102, 241, .75);
  }
  .primary-btn:active { transform: scale(.98); }
  .primary-btn:disabled {
    opacity: .45;
    pointer-events: none;
    box-shadow: none;
  }

  .ghost-btn {
    background: #fff;
    border: 1.5px solid #e2e8f0;
    color: #475569;
    padding: 14px 22px;
    border-radius: 16px;
    font-size: 0.95rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .ghost-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .ghost-btn:active { transform: scale(.98); }

  .back-btn {
    background: transparent;
    border: 1.5px solid #e2e8f0;
    color: #475569;
    padding: 8px 15px;
    border-radius: 12px;
    font-size: 0.84rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .back-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stats {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.76rem;
    color: #64748b;
    font-weight: 700;
  }
  .dot { color: #cbd5e1; }

  .quiz-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 14px;
    padding: 16px 6px;
    min-height: 170px;
  }
  .question-hint {
    font-size: 0.76rem;
    color: #94a3b8;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .question-prompt {
    font-size: clamp(1.5rem, 7vw, 2.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.3;
    word-break: break-word;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    padding: 0 4px;
  }

  .quiz-footer {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .answer-area { display: flex; gap: 10px; }
  .answer-area input {
    flex: 1;
    min-width: 0;
    padding: 14px 18px;
    border-radius: 15px;
    border: 1.5px solid #e2e8f0;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    background: #fff;
    transition: border-color .2s, box-shadow .2s;
  }
  .answer-area input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, .15);
  }
  .answer-area .primary-btn {
    width: auto;
    flex-shrink: 0;
    padding: 14px 26px;
  }

  .feedback {
    min-height: 22px;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.5;
  }
  .feedback.correct { color: #059669; }
  .feedback.wrong { color: #dc2626; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  .modal-overlay.hidden { display: none; }

  .modal-box {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 26px;
    padding: 28px 24px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .45);
    animation: pop .26s cubic-bezier(.34, 1.4, .64, 1);
  }
  @keyframes pop {
    from { transform: scale(.88); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal-icon { font-size: 2.4rem; line-height: 1; }
  .modal-title {
    font-size: 1.12rem;
    font-weight: 800;
    color: #dc2626;
  }
  .modal-label {
    font-size: 0.74rem;
    color: #94a3b8;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .modal-answer {
    font-size: 1.35rem;
    font-weight: 800;
    color: #1e293b;
    line-height: 1.4;
    padding: 14px 12px;
    border-radius: 16px;
    background: #f1f5f9;
    word-break: break-word;
  }
  .modal-box .primary-btn { margin-top: 4px; }
</style>
</head>
<body>

  <!-- ================= 页面一：导入词汇 ================= -->
  <div class="page active" id="pageImport">
    <div class="card">
      <div>
        <h1>📘 单词循环测</h1>
        <p class="subtitle">导入今日单词，随机抽查，答对消失 · 答错重来</p>
      </div>

      <div class="field">
        <label for="wordInput">单词列表（英文逗号分隔）</label>
        <textarea id="wordInput" rows="4"
          placeholder="apple(苹果/苹果树), banana(香蕉), cat(猫), dog(狗)"></textarea>
        <p class="hint">
          格式：<code>单词(中文1/中文2)</code> 或 <code>单词:中文1/中文2</code><br>
          没有中文释义的单词会被自动忽略
        </p>
      </div>

      <div class="action-row">
        <button class="primary-btn" id="importBtn">📥 导入词汇</button>
        <button class="ghost-btn" id="resetInputBtn">重置</button>
      </div>

      <div class="import-msg" id="importMsg">
        <span class="icon" id="importMsgIcon"></span>
        <span id="importMsgText"></span>
      </div>

      <div class="field">
        <label>出题方式</label>
        <div class="mode-selector">
          <label class="mode-option">
            <input type="radio" name="quizMode" value="en2ch" checked> 英 → 中
          </label>
          <label class="mode-option">
            <input type="radio" name="quizMode" value="ch2en"> 中 → 英
          </label>
        </div>
      </div>

      <button class="primary-btn" id="startBtn" disabled>开始练习 →</button>
    </div>
  </div>

  <!-- ================= 页面二：做题 ================= -->
  <div class="page" id="pageQuiz">
    <div class="card quiz-card">
      <div class="quiz-header">
        <button class="back-btn" id="backBtn">← 返回</button>
        <div class="stats">
          <span id="progressText">已掌握 0/0</span>
          <span class="dot">·</span>
          <span id="remainingCount">剩余 0</span>
          <span class="dot">·</span>
          <span id="accuracyText">正确率 --</span>
        </div>
      </div>

      <div class="quiz-body">
        <div class="question-hint" id="questionHint"></div>
        <div class="question-prompt" id="questionPrompt">—</div>
      </div>

      <div class="quiz-footer">
        <div class="answer-area">
          <input type="text" id="answerInput" placeholder="输入你的答案..."
                 autocomplete="off" autocorrect="off" spellcheck="false">
          <button class="primary-btn" id="submitBtn">提交</button>
        </div>
        <div class="feedback" id="feedbackMsg"></div>
      </div>
    </div>
  </div>

  <!-- ================= 答错弹窗 ================= -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-box">
      <div class="modal-icon">❌</div>
      <div class="modal-title">答错了</div>
      <div class="modal-label" id="modalLabel">正确答案</div>
      <div class="modal-answer" id="modalAnswer"></div>
      <button class="primary-btn" id="modalCloseBtn">知道了，继续</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  let vocabulary = [];
  let wordPool = [];
  let currentWord = null;
  let correctCount = 0;
  let wrongCount = 0;
  let locked = false;
  let pendingTimer = null;

  /* DOM */
  const pageImport   = document.getElementById('pageImport');
  const pageQuiz     = document.getElementById('pageQuiz');
  const wordInput    = document.getElementById('wordInput');
  const importBtn    = document.getElementById('importBtn');
  const resetInputBtn = document.getElementById('resetInputBtn');
  const startBtn     = document.getElementById('startBtn');
  const importMsg    = document.getElementById('importMsg');
  const importMsgIcon = document.getElementById('importMsgIcon');
  const importMsgText = document.getElementById('importMsgText');
  const backBtn      = document.getElementById('backBtn');
  const progressText = document.getElementById('progressText');
  const remainingCount = document.getElementById('remainingCount');
  const accuracyText = document.getElementById('accuracyText');
  const questionHint = document.getElementById('questionHint');
  const questionPrompt = document.getElementById('questionPrompt');
  const answerInput  = document.getElementById('answerInput');
  const submitBtn    = document.getElementById('submitBtn');
  const feedbackMsg  = document.getElementById('feedbackMsg');
  const modal        = document.getElementById('modal');
  const modalLabel   = document.getElementById('modalLabel');
  const modalAnswer  = document.getElementById('modalAnswer');
  const modalCloseBtn = document.getElementById('modalCloseBtn');

  /* ---------- 工具函数 ---------- */
  function getQuizMode() {
    const checked = document.querySelector('input[name="quizMode"]:checked');
    return checked ? checked.value : 'en2ch';
  }

  function switchPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function showImportMsg(type, text) {
    importMsg.className = 'import-msg show ' + type;
    importMsgIcon.textContent = type === 'success' ? '✅' : '⚠️';
    importMsgText.textContent = text;
  }

  function hideImportMsg() {
    importMsg.className = 'import-msg';
    importMsgIcon.textContent = '';
    importMsgText.textContent = '';
  }

  /* ---------- 解析导入内容 ---------- */
  function parseWordList(raw) {
    const tokens = raw.split(',').map(s => s.trim()).filter(Boolean);
    const map = new Map();
    let skipped = 0;

    for (const token of tokens) {
      let en = '';
      let chList = [];

      let m = token.match(/^(.+?)\s*[（(]\s*([^)）]+?)\s*[）)]\s*$/);
      if (m) {
        en = m[1].trim();
        chList = m[2].split(/[\/、,，]/).map(s => s.trim()).filter(Boolean);
      } else {
        m = token.match(/^(.+?)\s*[:：]\s*(.+)$/);
        if (m) {
          en = m[1].trim();
          chList = m[2].split(/[\/、,，]/).map(s => s.trim()).filter(Boolean);
        } else {
          skipped++;
          continue;
        }
      }

      if (!en || chList.length === 0) { skipped++; continue; }

      if (map.has(en)) {
        const exist = map.get(en);
        exist.ch = [...new Set([...exist.ch, ...chList])];
      } else {
        map.set(en, { en, ch: [...new Set(chList)] });
      }
    }
    return { list: [...map.values()], skipped };
  }

  /* ---------- 导入 ---------- */
  function handleImport() {
    const raw = wordInput.value.trim();

    if (!raw) {
      vocabulary = [];
      startBtn.disabled = true;
      showImportMsg('error', '导入失败：请先在输入框中填写单词。');
      return;
    }

    const { list, skipped } = parseWordList(raw);

    if (list.length === 0) {
      vocabulary = [];
      startBtn.disabled = true;
      showImportMsg('error',
        '导入失败：未识别到有效单词。请使用格式 单词(中文1/中文2) 或 单词:中文1/中文2。');
      return;
    }

    vocabulary = list;
    startBtn.disabled = false;

    let msg = `导入成功：共 ${list.length} 个单词。`;
    if (skipped > 0) {
      msg += `（已忽略 ${skipped} 个缺少中文释义的条目）`;
    }
    showImportMsg('success', msg);
  }

  /* ---------- 重置输入 ---------- */
  function handleResetInput() {
    wordInput.value = '';
    vocabulary = [];
    startBtn.disabled = true;
    hideImportMsg();
    document.querySelector('input[name="quizMode"][value="en2ch"]').checked = true;
    wordInput.focus();
  }

  /* ---------- 开始测验 ---------- */
  function startQuiz() {
    if (vocabulary.length === 0) return;

    wordPool = vocabulary.map(w => ({ en: w.en, ch: [...w.ch] }));
    shuffleArray(wordPool);

    correctCount = 0;
    wrongCount = 0;
    currentWord = null;
    locked = false;
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }

    switchPage('pageQuiz');
    updateStats();

    if (wordPool.length === 0) {
      showEmptyState();
    } else {
      pickNextWord();
      // 只在开始练习时聚焦一次，方便直接输入
      setTimeout(() => answerInput.focus(), 120);
    }
  }

  /* ---------- 抽取下一题 ---------- */
  function pickNextWord() {
    if (wordPool.length === 0) {
      currentWord = null;
      showEmptyState();
      return;
    }

    let candidate = null;
    let attempts = 0;
    do {
      candidate = wordPool[Math.floor(Math.random() * wordPool.length)];
      attempts++;
    } while (wordPool.length > 1 && candidate === currentWord && attempts < 30);

    currentWord = candidate;
    renderQuestion();
  }

  /* ---------- 渲染题目 ---------- */
  function renderQuestion() {
    if (!currentWord) { showEmptyState(); return; }

    const mode = getQuizMode();

    if (mode === 'en2ch') {
      questionPrompt.textContent = currentWord.en;
      questionHint.textContent = '写出中文意思（多个用 / 分隔）';
    } else {
      questionPrompt.textContent = currentWord.ch.join(' / ');
      questionHint.textContent = '写出对应的英文单词';
    }

    answerInput.value = '';
    answerInput.disabled = false;
    submitBtn.disabled = false;
    feedbackMsg.className = 'feedback';
    feedbackMsg.textContent = '';
    locked = false;

    updateStats();
    // 注意：这里不再自动 focus，避免答对后键盘闪动
  }

  /* ---------- 统计 ---------- */
  function updateStats() {
    const total = vocabulary.length;
    const remaining = wordPool.length;
    const done = total - remaining;

    progressText.textContent = `已掌握 ${done}/${total}`;
    remainingCount.textContent = `剩余 ${remaining}`;

    const attempts = correctCount + wrongCount;
    accuracyText.textContent = attempts > 0
      ? `正确率 ${Math.round(correctCount / attempts * 100)}%`
      : '正确率 --';
  }

  /* ---------- 完成状态 ---------- */
  function showEmptyState() {
    questionHint.textContent = '本轮已完成';
    questionPrompt.textContent = '🎉 全部掌握！';
    answerInput.value = '';
    answerInput.disabled = true;
    submitBtn.disabled = true;
    feedbackMsg.className = 'feedback correct';
    feedbackMsg.textContent = '太棒了，没有剩余单词！';
    locked = false;
    updateStats();
  }

  /* ---------- 答案判断 ---------- */
  function checkAnswer(userAnswer, mode) {
    if (!currentWord) return false;

    const rawUser = userAnswer.trim();
    if (!rawUser) return false;

    if (mode === 'en2ch') {
      // 中文：宽松匹配，只要命中任意一个正确意思就算对
      const clean = s => s.replace(/[\s,，、.。?？!！;；:：\/\\（）()【】\[\]]/g, '').toLowerCase();

      // 用户输入可能包含多个意思（用 / 、 , 等分隔）
      const userParts = rawUser
        .split(/[\/、,，;；]/)
        .map(s => s.trim())
        .filter(Boolean);
      // 如果拆分后为空，用原文
      const candidates = userParts.length > 0 ? userParts : [rawUser];

      // 标准答案（多个）
      const stdParts = currentWord.ch.filter(Boolean);
      if (stdParts.length === 0) return false;

      // 任意一个用户答案 与 任意一个标准答案 完全相等（忽略空格/标点/大小写）即正确
      for (const uc of candidates) {
        const cleanUser = clean(uc);
        if (!cleanUser) continue;
        for (const sc of stdParts) {
          if (cleanUser === clean(sc)) {
            return true;
          }
        }
      }
      return false;
    } else {
      // 英文：完全拼写正确（忽略大小写和首尾空格）
      return rawUser.toLowerCase() === currentWord.en.trim().toLowerCase();
    }
  }

  /* ---------- 提交答案 ---------- */
  function handleSubmit() {
    if (locked || !currentWord) return;

    const userAnswer = answerInput.value.trim();
    if (!userAnswer) {
      feedbackMsg.className = 'feedback wrong';
      feedbackMsg.textContent = '⚠️ 请先输入答案';
      return;
    }

    const mode = getQuizMode();
    const isCorrect = checkAnswer(userAnswer, mode);

    if (isCorrect) {
      /* ===== 答对 ===== */
      correctCount++;
      const idx = wordPool.indexOf(currentWord);
      if (idx !== -1) wordPool.splice(idx, 1);

      feedbackMsg.className = 'feedback correct';
      feedbackMsg.textContent = '✅ 正确！';

      updateStats();

      // 锁定提交，但不禁用输入框（避免键盘收起再弹出）
      locked = true;

      // 快速切换下一题（约 350ms 后）
      pendingTimer = setTimeout(() => {
        pendingTimer = null;
        locked = false;
        if (wordPool.length === 0) {
          currentWord = null;
          showEmptyState();
        } else {
          pickNextWord();
        }
      }, 350);

    } else {
      /* ===== 答错 ===== */
      wrongCount++;
      feedbackMsg.className = 'feedback wrong';
      feedbackMsg.textContent = '❌ 答错了，正确答案已弹出';
      updateStats();

      // 弹出正确答案（中文意思）
      const correctText = mode === 'en2ch'
        ? currentWord.ch.join(' / ')
        : currentWord.en;
      modalLabel.textContent = mode === 'en2ch' ? '正确的中文意思' : '正确的英文单词';
      modalAnswer.textContent = correctText;
      modal.classList.remove('hidden');
    }
  }

  /* ---------- 关闭弹窗，继续下一题 ---------- */
  function closeModalAndContinue() {
    modal.classList.add('hidden');
    answerInput.value = '';
    if (wordPool.length === 0) {
      currentWord = null;
      showEmptyState();
    } else {
      pickNextWord();
    }
  }

  /* ---------- 返回首页 ---------- */
  function goBack() {
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    locked = false;
    modal.classList.add('hidden');
    switchPage('pageImport');
  }

  /* ---------- 事件绑定 ---------- */
  importBtn.addEventListener('click', handleImport);
  resetInputBtn.addEventListener('click', handleResetInput);
  startBtn.addEventListener('click', startQuiz);
  submitBtn.addEventListener('click', handleSubmit);
  backBtn.addEventListener('click', goBack);
  modalCloseBtn.addEventListener('click', closeModalAndContinue);

  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModalAndContinue();
  });

  answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!submitBtn.disabled) handleSubmit();
    }
  });

  wordInput.addEventListener('input', () => {
    if (vocabulary.length > 0) {
      startBtn.disabled = true;
      hideImportMsg();
    }
  });

  document.querySelectorAll('input[name="quizMode"]').forEach(radio => {
    radio.addEventListener('change', () => {
      if (pageQuiz.classList.contains('active') && currentWord) {
        renderQuestion();
      }
    });
  });

  /* 初始 */
  updateStats();
})();
</script>
</body>
</html>
